<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公共施設予約 - ログイン画面</title>
  <style>
    :root {
      /* ========== 色彩体系 ========== */
      /* 県庁の落ち着いたトーン：深い紺と石灰色を基調に、公務的な信頼感と厳格性を表現 */
      --primary: #2c3e50;
      --primary-hover: #1a252f;
      
      /* 背景：薄い石灰色（公文書のような質感）に微かな緑味を加えた落ち着き */
      --bg-main: #f0ede8;
      --bg-card: #e8e5e0;
      --bg-sidebar: #ebe8e3;
      --top-bar-bg: #2c3e50;
      --top-bar-border: #1a252f;
      
      /* 境界線：石灰色系で統一、やや濃いめで公式感を強調 */
      --border: #c9c5bd;
      
      /* テキスト：深い紺で、落ち着いた読みやすさ */
      --text: #1a1f26;
      --text-muted: #6b7280;
      
      /* ステータス・アラート色 */
      --success: #3d7e4a;
      --warning: #a67c52;
      --error: #8b4545;
      --info: #4a6fa5;
      
      /* ========== タイポグラフィ ========== */
      --font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      
      /* ========== 寸法・間隔 ========== */
      --space-unit: 8px;
      --control-height: 40px;
      
      /* 角丸：公式感を損なわないよう控えめに */
      --radius-card: 4px;
      --radius-control: 3px;
      
      /* ========== 枠線 ========== */
      --border-width: 1px;
      
      /* ========== 影・奥行き ========== */
      --shadow-card: 0 1px 3px rgba(28, 31, 38, 0.08);
      
      /* ========== モーション ========== */
      --motion-duration: 200ms;
      
      /* ========== 質感・テクスチャ ========== */
      /* 公文書の紙質感：微細な織目模様で、デジタルながら公式文書の重厚さを表現 */
      --surface-texture: 
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 2px,
          rgba(172, 167, 154, 0.03) 2px,
          rgba(172, 167, 154, 0.03) 4px
        ),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(172, 167, 154, 0.02) 2px,
          rgba(172, 167, 154, 0.02) 4px
        );
      --surface-texture-size: 100% 100%;
      --surface-texture-position: 0 0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: var(--font-family);
      background: linear-gradient(135deg, var(--bg-main) 0%, #ede9e3 100%);
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-unit);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card), 0 4px 12px rgba(28, 31, 38, 0.12);
      padding: calc(var(--space-unit) * 6);
      background-image: var(--surface-texture);
      background-size: var(--surface-texture-size);
      background-position: var(--surface-texture-position);
      animation: slideIn 0.4s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-header {
      margin-bottom: calc(var(--space-unit) * 4);
      text-align: center;
    }

    .login-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background: var(--primary);
      border-radius: var(--radius-control);
      margin-bottom: calc(var(--space-unit) * 2);
      box-shadow: 0 2px 6px rgba(44, 62, 80, 0.2);
    }

    .login-logo svg {
      width: 28px;
      height: 28px;
      stroke: #f0ede8;
      stroke-width: 2;
      fill: none;
    }

    .login-title {
      font-size: 24px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: calc(var(--space-unit) * 1);
      letter-spacing: -0.3px;
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 400;
      line-height: 1.5;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: calc(var(--space-unit) * 3);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: calc(var(--space-unit) * 1.5);
    }

    .form-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.2px;
    }

    .form-input {
      height: var(--control-height);
      padding: calc(var(--space-unit) * 1.25) calc(var(--space-unit) * 1.5);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-control);
      background: #f8f6f2;
      color: var(--text);
      font-family: var(--font-family);
      font-size: 14px;
      transition: all var(--motion-duration) ease;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.08);
    }

    .form-input::placeholder {
      color: #a9a39a;
    }

    .login-button {
      height: var(--control-height);
      background: var(--primary);
      color: #f0ede8;
      border: none;
      border-radius: var(--radius-control);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: all var(--motion-duration) ease;
      margin-top: calc(var(--space-unit) * 1);
      box-shadow: 0 2px 6px rgba(44, 62, 80, 0.15);
      font-family: var(--font-family);
    }

    .login-button:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 10px rgba(44, 62, 80, 0.25);
      transform: translateY(-1px);
    }

    .login-button:active {
      transform: translateY(0);
      box-shadow: 0 2px 4px rgba(44, 62, 80, 0.15);
    }

    .login-footer {
      margin-top: calc(var(--space-unit) * 5);
      padding-top: calc(var(--space-unit) * 3);
      border-top: var(--border-width) solid var(--border);
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .login-footer strong {
      color: var(--text);
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .login-container {
        max-width: 100%;
        padding: calc(var(--space-unit) * 4);
      }

      .login-title {
        font-size: 20px;
      }

      .login-subtitle {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"></path>
        </svg>
      </div>
      <h1 class="login-title" data-testid="login-title">ログイン</h1>
      <p class="login-subtitle">セキュリティインシデント対応・監査ログ分析システム</p>
    </div>

    <form class="login-form" data-testid="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">ユーザー名</label>
        <input
          class="form-input"
          type="text"
          id="username"
          name="username"
          data-testid="username"
          placeholder="ユーザー名を入力"
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">パスワード</label>
        <input
          class="form-input"
          type="password"
          id="password"
          name="password"
          data-testid="password"
          placeholder="パスワードを入力"
          autocomplete="current-password"
        >
      </div>

      <button
        class="login-button"
        type="submit"
        data-testid="login-button"
      >
        ログイン
      </button>
    </form>

    <div class="login-footer">
      <strong>※ サンプル実装について</strong><br>
      このサンプル実装では、どのような入力内容でもログインが成功します。
    </div>
  </div>

  <script>
    document.querySelector('[data-testid="login-form"]').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = './index.html';
    });
  </script>
</body>
</html>
