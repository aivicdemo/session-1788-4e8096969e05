<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公共施設予約 - ログイン画面</title>
  <style>
    :root {
      /* ========== 色彩体系 ========== */
      /* 県庁の落ち着いたトーン：深い紺と石灰色を基調に、公務的な信頼感と厳格性を表現 */
      --primary: #2c3e50;
      --primary-hover: #1a252f;
      
      /* 背景：薄い石灰色（公文書のような質感）に微かな緑味を加えた落ち着き */
      --bg-main: #f0ede8;
      --bg-card: #e8e5e0;
      --bg-sidebar: #ebe8e3;
      --top-bar-bg: #2c3e50;
      --top-bar-border: #1a252f;
      
      /* 境界線：石灰色系で統一、やや濃いめで公式感を強調 */
      --border: #c9c5bd;
      
      /* テキスト：深い紺で、落ち着いた読みやすさ */
      --text: #1a1f26;
      --text-muted: #6b7280;
      
      /* ステータス・アラート色 */
      --success: #3d7e4a;
      --warning: #a67c52;
      --error: #8b4545;
      --info: #4a6fa5;
      
      /* ========== タイポグラフィ ========== */
      --font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      
      /* ========== 寸法・間隔 ========== */
      --space-unit: 8px;
      --control-height: 40px;
      
      /* 角丸：公式感を損なわないよう控えめに */
      --radius-card: 4px;
      --radius-control: 3px;
      
      /* ========== 枠線 ========== */
      --border-width: 1px;
      
      /* ========== 影・奥行き ========== */
      --shadow-card: 0 1px 3px rgba(28, 31, 38, 0.08);
      
      /* ========== モーション ========== */
      --motion-duration: 200ms;
      
      /* ========== 質感・テクスチャ ========== */
      /* 公文書の紙質感：微細な織目模様で、デジタルながら公式文書の重厚さを表現 */
      --surface-texture: 
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 2px,
          rgba(172, 167, 154, 0.03) 2px,
          rgba(172, 167, 154, 0.03) 4px
        ),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(172, 167, 154, 0.02) 2px,
          rgba(172, 167, 154, 0.02) 4px
        );
      --surface-texture-size: 100% 100%;
      --surface-texture-position: 0 0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: var(--font-family);
      background: var(--bg-main);
      background-image: var(--surface-texture);
      background-size: var(--surface-texture-size);
      background-position: var(--surface-texture-position);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-unit) * 2;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: var(--bg-card);
      background-image: var(--surface-texture);
      background-size: var(--surface-texture-size);
      background-position: var(--surface-texture-position);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: calc(var(--space-unit) * 6);
    }

    .login-header {
      text-align: center;
      margin-bottom: calc(var(--space-unit) * 5);
    }

    .login-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background: var(--primary);
      border-radius: var(--radius-control);
      margin-bottom: calc(var(--space-unit) * 2);
      font-weight: 700;
      color: #ffffff;
      font-size: 20px;
      letter-spacing: -0.5px;
    }

    .login-title {
      font-size: 24px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: calc(var(--space-unit) * 1);
      letter-spacing: -0.3px;
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: calc(var(--space-unit) * 3);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: calc(var(--space-unit) * 1);
    }

    .form-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.2px;
    }

    .form-input {
      height: var(--control-height);
      padding: calc(var(--space-unit) * 1) calc(var(--space-unit) * 1.5);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-control);
      background: #ffffff;
      font-family: var(--font-family);
      font-size: 14px;
      color: var(--text);
      transition: border-color var(--motion-duration) ease, box-shadow var(--motion-duration) ease;
      outline: none;
    }

    .form-input::placeholder {
      color: var(--text-muted);
      opacity: 0.6;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(44, 62, 80, 0.1);
    }

    .form-input:hover:not(:focus) {
      border-color: #b8b3aa;
    }

    .login-button {
      height: var(--control-height);
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-control);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color var(--motion-duration) ease, box-shadow var(--motion-duration) ease;
      letter-spacing: 0.3px;
      margin-top: calc(var(--space-unit) * 1);
    }

    .login-button:hover {
      background: var(--primary-hover);
      box-shadow: 0 2px 6px rgba(28, 31, 38, 0.12);
    }

    .login-button:active {
      transform: translateY(1px);
      box-shadow: 0 1px 3px rgba(28, 31, 38, 0.08);
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-footer {
      margin-top: calc(var(--space-unit) * 5);
      padding-top: calc(var(--space-unit) * 4);
      border-top: var(--border-width) solid var(--border);
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .login-footer-note {
      font-style: italic;
      opacity: 0.8;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: calc(var(--space-unit) * 4);
      }

      .login-title {
        font-size: 20px;
      }

      .login-subtitle {
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .form-input,
      .login-button {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">施</div>
        <h1 class="login-title" data-testid="login-title">公共施設予約</h1>
        <p class="login-subtitle">セキュリティインシデント対応・監査ログ分析システム</p>
      </div>

      <form class="login-form" data-testid="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">ユーザー名</label>
          <input
            class="form-input"
            type="text"
            id="username"
            name="username"
            data-testid="username"
            placeholder="ユーザー名を入力"
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">パスワード</label>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            data-testid="password"
            placeholder="パスワードを入力"
            autocomplete="current-password"
          >
        </div>

        <button
          class="login-button"
          type="submit"
          data-testid="login-button"
        >
          ログイン
        </button>
      </form>

      <div class="login-footer">
        <p class="login-footer-note">
          ※ サンプル実装ではどの入力でもログインできます
        </p>
      </div>
    </div>
  </div>

  <script>
    document.querySelector('[data-testid="login-form"]').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = './index.html';
    });
  </script>
</body>
</html>
