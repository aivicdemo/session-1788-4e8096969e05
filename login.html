<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公共施設予約 - ログイン画面</title>
  <style>
    :root {
      /* ========== 色彩基盤 ========== */
      /* 県庁の落ち着いたトーン：深い紺と薄い灰白を基調に、
         公共機関の信頼感と厳粛性を表現。
         暗めの背景に白文字で、長時間の監査業務に対応。 */
      
      --primary: #2c3e50;
      --primary-hover: #1a252f;
      --bg-main: #0f1419;
      --bg-card: #1a1f28;
      --bg-sidebar: #151a22;
      --border: #2a3142;
      --text: #e8eaed;
      --text-muted: #9ca3af;
      --top-bar-bg: #1f2937;
      --top-bar-border: #374151;
      --top-bar-text: #f3f4f6;

      /* ========== タイポグラフィ ========== */
      /* 県庁システムの格式を保ちながら、
         セキュリティ監査の緊張感を和らげる可読性重視の書体選定 */
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;

      /* ========== 角丸・影 ========== */
      /* 公共機関の堅牢性と現代的な親しみやすさの折衷。
         カード類は控えめな角丸で、影は淡く奥行きを表現。 */
      --radius-card: 6px;
      --radius-control: 4px;
      --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.4);

      /* ========== 境界・寸法 ========== */
      /* セキュリティシステムの視認性を確保しつつ、
         過度な装飾を避ける。境界線は控えめで、
         要素間の距離で階層を表現。 */
      --border-width: 1px;
      --control-height: 36px;
      --space-unit: 8px;

      /* ========== アニメーション ========== */
      /* 監査ログの大量データ処理時の応答性を示しながら、
         落ち着きを損なわない速度。 */
      --motion-duration: 200ms;

      /* ========== 質感・テクスチャ ========== */
      /* 県庁の公式文書のような紙質感と、
         デジタルシステムの清潔感を融合。
         微細な織目パターンで深みを表現。 */
      --surface-texture: repeating-linear-gradient(
        90deg,
        transparent,
        transparent 2px,
        rgba(255, 255, 255, 0.02) 2px,
        rgba(255, 255, 255, 0.02) 4px
      ),
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255, 255, 255, 0.015) 2px,
        rgba(255, 255, 255, 0.015) 4px
      );
      --surface-texture-size: 100% 100%;
      --surface-texture-position: 0 0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: var(--font-family);
      background: var(--bg-main);
      color: var(--text);
      line-height: 1.5;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-unit) * 2;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: var(--bg-card);
      background-image: var(--surface-texture);
      background-size: var(--surface-texture-size);
      background-position: var(--surface-texture-position);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: calc(var(--space-unit) * 6);
    }

    .login-header {
      margin-bottom: calc(var(--space-unit) * 5);
      text-align: center;
    }

    .login-title {
      font-size: 24px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: calc(var(--space-unit) * 1);
      letter-spacing: -0.3px;
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: calc(var(--space-unit) * 3);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: calc(var(--space-unit) * 1.5);
    }

    .form-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      height: var(--control-height);
      padding: 0 calc(var(--space-unit) * 1.5);
      background: rgba(255, 255, 255, 0.05);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-control);
      color: var(--text);
      font-size: 14px;
      font-family: var(--font-family);
      transition: all var(--motion-duration) ease;
      outline: none;
    }

    .form-input::placeholder {
      color: var(--text-muted);
    }

    .form-input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(44, 62, 80, 0.2);
    }

    .form-input:hover:not(:focus) {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(44, 62, 80, 0.6);
    }

    .login-button {
      height: var(--control-height);
      background: var(--primary);
      border: none;
      border-radius: var(--radius-control);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all var(--motion-duration) ease;
      margin-top: calc(var(--space-unit) * 1);
    }

    .login-button:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 12px rgba(44, 62, 80, 0.3);
    }

    .login-button:active {
      transform: translateY(1px);
      box-shadow: 0 2px 6px rgba(44, 62, 80, 0.2);
    }

    .login-footer {
      margin-top: calc(var(--space-unit) * 4);
      padding-top: calc(var(--space-unit) * 3);
      border-top: var(--border-width) solid var(--border);
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: calc(var(--space-unit) * 4);
      }

      .login-title {
        font-size: 20px;
      }

      .login-subtitle {
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .form-input,
      .login-button {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1 class="login-title" data-testid="login-title">セキュリティ監査</h1>
        <p class="login-subtitle">インシデント対応・監査ログ分析システム</p>
      </div>

      <form class="login-form" data-testid="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">ユーザーID</label>
          <input
            class="form-input"
            id="username"
            type="text"
            name="username"
            data-testid="username"
            placeholder="ユーザーIDを入力"
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">パスワード</label>
          <input
            class="form-input"
            id="password"
            type="password"
            name="password"
            data-testid="password"
            placeholder="パスワードを入力"
            autocomplete="current-password"
          >
        </div>

        <button class="login-button" type="submit" data-testid="login-button">
          ログイン
        </button>
      </form>

      <div class="login-footer">
        <p>※ サンプル実装では、どの入力内容でもログインできます。</p>
      </div>
    </div>
  </div>

  <script>
    document.querySelector('[data-testid="login-form"]').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = './index.html';
    });
  </script>
</body>
</html>
