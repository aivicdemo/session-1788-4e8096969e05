<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公共施設予約 - ログイン画面</title>
  <style>
    :root {
      /* ========== 色彩体系 ========== */
      /* 県庁の落ち着いたトーン：深い紺と石色を基調に、公共性と信頼感を表現 */
      --primary: #1e3a5f;
      --primary-hover: #152a47;
      --primary-light: #2d5a8c;
      
      /* 背景：薄い石灰色（公文書の紙質感を想起） */
      --bg-main: #f0ede8;
      --bg-card: #e8e5df;
      --bg-sidebar: #ebe8e2;
      --top-bar-bg: #1e3a5f;
      --top-bar-border: #152a47;
      
      /* テキスト */
      --text: #2a2520;
      --text-muted: #6b6560;
      
      /* 境界線：落ち着いた灰色、県庁の厳格さを表現 */
      --border: #c9c4bc;
      
      /* ========== タイポグラフィ ========== */
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      
      /* ========== 寸法・間隔 ========== */
      --space-unit: 8px;
      --control-height: 40px;
      --border-width: 1px;
      
      /* ========== 角丸 ========== */
      /* 県庁の格調を損なわないよう、控えめな角丸 */
      --radius-card: 4px;
      --radius-control: 3px;
      
      /* ========== 影 ========== */
      /* 紙のような薄い影：公文書の積み重ねを暗示 */
      --shadow-card: 0 2px 6px rgba(30, 58, 95, 0.08), 0 1px 2px rgba(30, 58, 95, 0.04);
      
      /* ========== 質感 ========== */
      /* 和紙のような微細な織目を表現：公共施設の落ち着きと信頼感 */
      --surface-texture: 
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 2px,
          rgba(30, 58, 95, 0.02) 2px,
          rgba(30, 58, 95, 0.02) 4px
        ),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(30, 58, 95, 0.015) 2px,
          rgba(30, 58, 95, 0.015) 4px
        );
      --surface-texture-size: 100% 100%;
      --surface-texture-position: 0 0;
      
      /* ========== モーション ========== */
      /* 行政手続きの厳格さを保ちながら、適度な応答性 */
      --motion-duration: 200ms;
      
      /* ========== セマンティック色 ========== */
      --success: #2e7d32;
      --success-light: #e8f5e9;
      --warning: #f57c00;
      --warning-light: #fff3e0;
      --error: #c62828;
      --error-light: #ffebee;
      --info: #1565c0;
      --info-light: #e3f2fd;
      
      /* ========== 追加の質感制御 ========== */
      /* カード・パネルの微妙な立体感 */
      --card-border-color: rgba(30, 58, 95, 0.06);
      --divider-color: rgba(30, 58, 95, 0.08);
      
      /* フォーカス状態（キーボード操作時の視認性） */
      --focus-outline: 2px solid #1e3a5f;
      --focus-outline-offset: 2px;
      
      /* ========== 入力フィールド ========== */
      --input-bg: #ffffff;
      --input-border: #c9c4bc;
      --input-border-focus: #1e3a5f;
      --input-text: #2a2520;
      --input-placeholder: #9a9490;
      
      /* ========== ボタン ========== */
      --button-primary-bg: #1e3a5f;
      --button-primary-text: #ffffff;
      --button-primary-hover: #152a47;
      --button-secondary-bg: #e8e5df;
      --button-secondary-text: #2a2520;
      --button-secondary-hover: #ddd9d1;
      --button-disabled-bg: #d4cfc7;
      --button-disabled-text: #9a9490;
      
      /* ========== サイドバー ========== */
      --sidebar-item-hover: rgba(30, 58, 95, 0.08);
      --sidebar-item-active-bg: rgba(30, 58, 95, 0.12);
      --sidebar-item-active-border: #1e3a5f;
      
      /* ========== テーブル ========== */
      --table-header-bg: #e8e5df;
      --table-header-text: #2a2520;
      --table-row-hover: rgba(30, 58, 95, 0.04);
      --table-border: #c9c4bc;
      
      /* ========== ステータスバッジ ========== */
      --badge-bg: #e8e5df;
      --badge-text: #2a2520;
      --badge-border: #c9c4bc;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: var(--font-family);
      background: linear-gradient(135deg, var(--bg-main) 0%, var(--bg-card) 100%);
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-unit) * 2;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: var(--input-bg);
      border: var(--border-width) solid var(--card-border-color);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: calc(var(--space-unit) * 6);
      background-image: var(--surface-texture);
      background-size: var(--surface-texture-size);
      background-position: var(--surface-texture-position);
    }

    .login-header {
      text-align: center;
      margin-bottom: calc(var(--space-unit) * 4);
    }

    .login-header-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto calc(var(--space-unit) * 2);
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      border-radius: var(--radius-control);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      font-weight: 600;
    }

    .login-header h1 {
      font-size: 24px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: calc(var(--space-unit) * 1);
    }

    .login-header p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: calc(var(--space-unit) * 3);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: calc(var(--space-unit) * 1.5);
    }

    .form-group label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.3px;
    }

    .form-group input {
      height: var(--control-height);
      padding: 0 calc(var(--space-unit) * 2);
      border: var(--border-width) solid var(--input-border);
      border-radius: var(--radius-control);
      background: var(--input-bg);
      color: var(--input-text);
      font-size: 14px;
      font-family: var(--font-family);
      transition: border-color var(--motion-duration) ease, box-shadow var(--motion-duration) ease;
    }

    .form-group input::placeholder {
      color: var(--input-placeholder);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--input-border-focus);
      box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.1);
    }

    .login-button {
      height: var(--control-height);
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: var(--button-primary-text);
      border: none;
      border-radius: var(--radius-control);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: background var(--motion-duration) ease, box-shadow var(--motion-duration) ease, transform var(--motion-duration) ease;
      margin-top: calc(var(--space-unit) * 1);
    }

    .login-button:hover {
      background: linear-gradient(135deg, var(--primary-hover) 0%, var(--primary) 100%);
      box-shadow: 0 4px 12px rgba(30, 58, 95, 0.15);
      transform: translateY(-1px);
    }

    .login-button:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px rgba(30, 58, 95, 0.1);
    }

    .login-button:focus {
      outline: var(--focus-outline);
      outline-offset: var(--focus-outline-offset);
    }

    .login-footer {
      margin-top: calc(var(--space-unit) * 4);
      padding-top: calc(var(--space-unit) * 3);
      border-top: var(--border-width) solid var(--divider-color);
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .login-footer strong {
      color: var(--text);
      font-weight: 500;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: calc(var(--space-unit) * 4);
      }

      .login-header h1 {
        font-size: 20px;
      }

      .login-header p {
        font-size: 13px;
      }

      .form-group label {
        font-size: 12px;
      }

      .form-group input {
        font-size: 16px;
      }

      .login-button {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .form-group input,
      .login-button {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-header-icon">🏛️</div>
        <h1 data-testid="login-title">ログイン</h1>
        <p>公共施設予約システムへようこそ</p>
      </div>

      <form data-testid="login-form" class="login-form" novalidate>
        <div class="form-group">
          <label for="username">ユーザー名</label>
          <input
            type="text"
            id="username"
            name="username"
            data-testid="username"
            placeholder="ユーザー名を入力"
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="password">パスワード</label>
          <input
            type="password"
            id="password"
            name="password"
            data-testid="password"
            placeholder="パスワードを入力"
            autocomplete="current-password"
          >
        </div>

        <button type="submit" data-testid="login-button" class="login-button">
          ログイン
        </button>

        <div class="login-footer">
          <p><strong>サンプル実装について：</strong><br>
          このログイン画面はサンプル実装です。<br>
          どのような入力でもログインできます。</p>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.querySelector('[data-testid="login-form"]').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = './index.html';
    });
  </script>
</body>
</html>
